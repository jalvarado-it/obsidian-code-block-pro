name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag '$tag' does not match manifest version '$manifest_version'."
            exit 1
          fi

      - name: Generate checksums
        run: npm run checksums

      - name: Generate release notes
        run: npm run release-notes

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            sbom.cdx.json
            sbom.runtime.cdx.json
            sbom.spdx.json
            SHA256SUMS

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          gh release create "$tag" \
            --title "Code Block Pro $version" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css \
            sbom.cdx.json sbom.runtime.cdx.json sbom.spdx.json SHA256SUMS
